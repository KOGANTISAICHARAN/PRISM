<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRISM — offline</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; }
      .box { max-width: 380px; text-align: center; }
      .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: #2547eb; color: #fff; font-weight: 700; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #475569; font-size: 14px; line-height: 1.5; }
      a { display: inline-block; margin-top: 16px; background: #2547eb; color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="box">
      <span class="mark">P</span>
      <h1>You are offline</h1>
      <p>PRISM needs a connection to submit reports and fetch case updates. Your device will reconnect automatically.</p>
      <a href="/">Retry</a>
    </div>
  </body>
</html>
